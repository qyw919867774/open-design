name: Build DMG + EXE

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build'
        required: false
        default: 'dhcoder'

jobs:
  build-mac:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install

      - name: Build macOS DMG
        run: pnpm tools-pack mac build --to dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-design-mac-dmg
          path: dist/*.dmg
          if-no-files-found: error

  build-win:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        shell: pwsh
        run: corepack enable

      - name: Install dependencies
        shell: pwsh
        run: pnpm install

      - name: Build Windows installer
        shell: pwsh
        run: pnpm tools-pack win build --to nsis

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-design-win-exe
          path: dist/*.exe
          if-no-files-found: error
